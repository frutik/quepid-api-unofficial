[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quepid-models"
version = "0.1.0"
description = "Django models mirroring the Quepid Rails schema (inspectdb output)"
requires-python = ">=3.11"
dependencies = ["Django>=5.0"]

[project.optional-dependencies]
ninja = ["django-ninja"]

[tool.setuptools]
packages = ["quepid"]
