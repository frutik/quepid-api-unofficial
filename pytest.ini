[pytest]
testpaths = tests

# These tests talk to a running stack over HTTP. They never import Django, so
# there is deliberately no DJANGO_SETTINGS_MODULE and no pytest-django here --
# the models are unmanaged (see CLAUDE.md), so pytest-django could not build a
# test database for them anyway, and mocking the ORM would hide exactly the
# class of bug these tests exist to catch: Rails dropping a column out from
# under quepid/models.py.

markers =
    integration: needs a live Quepid + API stack (see tests/conftest.py)

# No default marker filter: every test here is an integration test, and they
# skip themselves cleanly when QUEPID_API_TOKEN is unset, so a bare `pytest`
# is safe on a machine with no stack running.
addopts = --strict-markers
